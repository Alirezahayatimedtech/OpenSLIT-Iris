[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openslit-iris"
version = "0.4.0"
description = "Reproducible collaborative grading, CVAT segmentation, AI assistance, adjudication, and quantitative iris feature extraction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<3",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
cvat = [
  "cvat-sdk==2.64.0",
]
google = [
  "google-api-python-client>=2.150,<3",
  "google-auth>=2.35,<3",
  "google-auth-httplib2>=0.2,<1",
]
ai = [
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
  "segmentation-models-pytorch>=0.4,<1",
  "transformers>=4.45,<6",
  "timm>=1.0,<2",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.scripts]
openslit-collab = "openslit.collaboration.cli:main"
openslit-validate-masks = "openslit.annotation.validate_masks:main"
openslit-cvat = "openslit.cvat.cli:main"
openslit-workflow = "openslit.workflow.cli:main"
openslit-ai = "openslit.ai.cli:main"
openslit-features = "openslit.features.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openslit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
