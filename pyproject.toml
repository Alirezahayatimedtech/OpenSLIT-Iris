[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openslit-iris"
version = "0.1.0"
description = "Reproducible collaborative quality grading and annotation workflow for slit-lamp iris datasets"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<3",
  "Pillow>=10,<12",
]

[project.scripts]
openslit-collab = "openslit.collaboration.cli:main"
openslit-validate-masks = "openslit.annotation.validate_masks:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openslit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
