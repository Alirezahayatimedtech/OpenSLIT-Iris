<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Slit-Lamp Iris Segmentation</title>
  <desc id="desc">Illustrative side-by-side example of an input slit-lamp image and its target segmentation output for pupil, iris, reflection, slit-beam, eyelid, and eyelash classes.</desc>
  <defs>
    <radialGradient id="irisNatural" cx="50%" cy="48%" r="56%">
      <stop offset="0" stop-color="#8f612d"/>
      <stop offset="0.55" stop-color="#775022"/>
      <stop offset="1" stop-color="#4d331c"/>
    </radialGradient>
    <radialGradient id="sclera" cx="48%" cy="48%" r="70%">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="0.72" stop-color="#f5eadf"/>
      <stop offset="1" stop-color="#d5bcb0"/>
    </radialGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a86651"/>
      <stop offset="1" stop-color="#d9a38c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <clipPath id="eyeClipLeft"><path d="M110 520 Q360 285 680 480 Q390 720 110 520 Z"/></clipPath>
    <clipPath id="eyeClipRight"><path d="M850 520 Q1100 285 1420 480 Q1130 720 850 520 Z"/></clipPath>
    <pattern id="irisTexture" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <path d="M0 10 L20 7" stroke="#3b2515" stroke-width="2" opacity="0.5"/>
      <path d="M4 0 L11 20" stroke="#d29b54" stroke-width="1.3" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="800" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#0f172a">Slit-Lamp Iris Segmentation</text>
  <text x="800" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#475569">Illustrative target output for the OpenSLIT-Iris annotation protocol</text>

  <g filter="url(#shadow)">
    <rect x="55" y="160" width="690" height="620" rx="26" fill="#ffffff"/>
    <rect x="805" y="160" width="740" height="620" rx="26" fill="#ffffff"/>
  </g>

  <text x="400" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#1e293b">Slit-Lamp Image</text>
  <text x="1175" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#1e293b">Segmentation Output</text>

  <!-- Natural input eye -->
  <g>
    <path d="M110 520 Q360 285 680 480 Q390 720 110 520 Z" fill="url(#sclera)" stroke="#7c4a39" stroke-width="7"/>
    <g clip-path="url(#eyeClipLeft)">
      <ellipse cx="400" cy="505" rx="190" ry="188" fill="url(#irisNatural)"/>
      <ellipse cx="400" cy="505" rx="178" ry="176" fill="url(#irisTexture)" opacity="0.8"/>
      <circle cx="400" cy="505" r="75" fill="#09070a"/>
      <circle cx="400" cy="505" r="100" fill="none" stroke="#d9a85a" stroke-width="8" opacity="0.5" stroke-dasharray="18 13"/>
      <rect x="495" y="315" width="30" height="390" rx="15" fill="#fff9b5" opacity="0.82"/>
      <rect x="500" y="315" width="9" height="390" rx="4" fill="#ffffff" opacity="0.95"/>
      <ellipse cx="470" cy="455" rx="20" ry="13" fill="#fff" opacity="0.95"/>
      <ellipse cx="450" cy="425" rx="11" ry="8" fill="#fff" opacity="0.8"/>
    </g>
    <path d="M110 520 Q355 282 680 480" fill="none" stroke="url(#lid)" stroke-width="38" stroke-linecap="round"/>
    <path d="M110 520 Q385 715 680 480" fill="none" stroke="url(#lid)" stroke-width="30" stroke-linecap="round"/>
    <g stroke="#3d241e" stroke-width="7" stroke-linecap="round">
      <path d="M205 417 l-28 -55"/><path d="M244 385 l-18 -59"/><path d="M290 355 l-8 -60"/><path d="M338 336 l5 -60"/><path d="M389 326 l16 -59"/>
      <path d="M458 330 l27 -55"/><path d="M510 346 l37 -48"/><path d="M558 370 l44 -39"/><path d="M604 402 l49 -30"/>
    </g>
  </g>

  <!-- Segmented eye -->
  <g>
    <path d="M850 520 Q1100 285 1420 480 Q1130 720 850 520 Z" fill="url(#sclera)" stroke="#7c4a39" stroke-width="7"/>
    <g clip-path="url(#eyeClipRight)">
      <ellipse cx="1140" cy="505" rx="190" ry="188" fill="#2fca78" fill-opacity="0.68" stroke="#148a4e" stroke-width="5"/>
      <ellipse cx="1140" cy="505" rx="178" ry="176" fill="url(#irisTexture)" opacity="0.22"/>
      <circle cx="1140" cy="505" r="75" fill="#3355ff" fill-opacity="0.92" stroke="#1732ba" stroke-width="5"/>
      <rect x="1235" y="315" width="30" height="390" rx="15" fill="#ff4545" fill-opacity="0.8" stroke="#b91c1c" stroke-width="4"/>
      <ellipse cx="1210" cy="455" rx="22" ry="14" fill="#ffe11a" fill-opacity="0.95" stroke="#b48b00" stroke-width="4"/>
      <ellipse cx="1190" cy="425" rx="12" ry="9" fill="#ffe11a" fill-opacity="0.95" stroke="#b48b00" stroke-width="3"/>
    </g>
    <path d="M850 520 Q1095 282 1420 480" fill="none" stroke="#a250d8" stroke-width="42" stroke-linecap="round" opacity="0.88"/>
    <path d="M850 520 Q1125 715 1420 480" fill="none" stroke="#a250d8" stroke-width="34" stroke-linecap="round" opacity="0.88"/>
    <g stroke="#ff8c19" stroke-width="10" stroke-linecap="round">
      <path d="M945 417 l-28 -55"/><path d="M984 385 l-18 -59"/><path d="M1030 355 l-8 -60"/><path d="M1078 336 l5 -60"/><path d="M1129 326 l16 -59"/>
      <path d="M1198 330 l27 -55"/><path d="M1250 346 l37 -48"/><path d="M1298 370 l44 -39"/><path d="M1344 402 l49 -30"/>
    </g>
  </g>

  <!-- Callouts -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#1e293b" stroke="#334155" stroke-width="2.5">
    <path d="M920 270 L1045 360" fill="none"/><circle cx="1045" cy="360" r="5" fill="#a250d8" stroke="none"/><text x="820" y="266" stroke="none">Eyelid</text>
    <path d="M1370 285 L1315 365" fill="none"/><circle cx="1315" cy="365" r="5" fill="#ff8c19" stroke="none"/><text x="1375" y="280" stroke="none">Eyelash</text>
    <path d="M870 690 L1030 585" fill="none"/><circle cx="1030" cy="585" r="5" fill="#2fca78" stroke="none"/><text x="825" y="718" stroke="none">Iris</text>
    <path d="M1030 760 L1110 565" fill="none"/><circle cx="1110" cy="565" r="5" fill="#3355ff" stroke="none"/><text x="970" y="792" stroke="none">Pupil</text>
    <path d="M1305 760 L1220 470" fill="none"/><circle cx="1220" cy="470" r="5" fill="#ffe11a" stroke="none"/><text x="1280" y="792" stroke="none">Reflection</text>
    <path d="M1460 670 L1250 610" fill="none"/><circle cx="1250" cy="610" r="5" fill="#ff4545" stroke="none"/><text x="1435" y="704" stroke="none">Slit-beam</text>
  </g>

  <!-- Legend -->
  <g transform="translate(205,835)" font-family="Arial, Helvetica, sans-serif">
    <rect width="1190" height="112" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="34" y="42" font-size="23" font-weight="700" fill="#0f172a">Classes</text>
    <g font-size="19" font-weight="600" fill="#334155">
      <rect x="145" y="24" width="28" height="28" rx="6" fill="#3355ff"/><text x="184" y="45">Pupil</text>
      <rect x="285" y="24" width="28" height="28" rx="6" fill="#2fca78"/><text x="324" y="45">Iris</text>
      <rect x="410" y="24" width="28" height="28" rx="6" fill="#ffe11a"/><text x="449" y="45">Reflection</text>
      <rect x="600" y="24" width="28" height="28" rx="6" fill="#ff4545"/><text x="639" y="45">Slit-beam</text>
      <rect x="790" y="24" width="28" height="28" rx="6" fill="#a250d8"/><text x="829" y="45">Eyelid</text>
      <rect x="940" y="24" width="28" height="28" rx="6" fill="#ff8c19"/><text x="979" y="45">Eyelash</text>
    </g>
    <text x="34" y="86" font-size="17" fill="#64748b">Schematic example only. Annotators must follow the visible-boundary and class-precedence rules in Annotation Protocol v1.0.</text>
  </g>
</svg>
